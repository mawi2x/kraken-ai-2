services:
  ai2:
    build: .
    ports:
      - "5003:5003"
    environment:
      # Values come from .env (copy .env.example). FLAG/SECRET_KEY are required.
      - FLAG=${FLAG:?set FLAG in .env}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - WRECK=${WRECK:-Mourning Star}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - PORT=5003
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-160}
      - OLLAMA_MAX_INFLIGHT=${OLLAMA_MAX_INFLIGHT:-4}
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-0}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-15}
      - VULNERABLE_PROMPT_MODE=${VULNERABLE_PROMPT_MODE:-0}
      - VULN_CALLER_TOKEN=${VULN_CALLER_TOKEN:-FLYING_DUTCHMAN}
      - VULN_UNLOCK_TOKEN=${VULN_UNLOCK_TOKEN:-TIDEGLASS_7Q4}
      - VULN_CONFIRM_TOKEN=${VULN_CONFIRM_TOKEN:-SALTFRAME_9N2}
    volumes:
      - ./instance:/app/instance  # keep the chat log across rebuilds
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    # The image ships no curl/wget — `ollama list` is the healthcheck that works.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    # Uncomment if the host has an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot: pull the model before ai2 is allowed to start, so the challenge
  # never silently degrades into the rule-engine voice.
  model-pull:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\" && ollama list"]
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
